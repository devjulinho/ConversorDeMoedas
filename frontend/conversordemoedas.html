<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/styles.css">
    <title>Conversor de Moedas</title>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>Conversor de moedas</h1>
            <p>É só escolher quais moedas que você quer converter e inserir o valor!</p>
        </div>
    </header>
    <main>
        <div class="conteudo">
            <div class="moedaOrigem">
                <select><option>1</option></select>
                <input type="text" placeholder="0,00">
            </div>
            <div class="moedaDestino">
                <select><option>1</option></select>
                <input type="text" placeholder="Primeira Moeda">
            </div>
        </div>
        <button>Converter</button>
    </main>
    <footer>
        <p>Última atualização da taxa de conversão: </p>
    </footer>
</body>
</html>
